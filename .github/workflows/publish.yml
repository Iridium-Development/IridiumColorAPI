name: Publish Artifacts
on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Test with Gradle
        run: ./gradlew test
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload artifacts
        uses: "actions/upload-artifact@v7.0.1"
        with:
          name: "IridiumColorAPI"
          path: "build/libs/IridiumColorAPI-*.jar"

  update-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Downloading artifact
        uses: actions/checkout@v6
      - uses: thecodemonkey/action-get-gradle-version@master
        id: version
        with:
          file: "build.gradle.kts"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: "IridiumColorAPI"
          path: "./"

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: "IridiumColorAPI-*.jar"

  publish-nexus:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: thecodemonkey/action-get-gradle-version@master
        id: version
        with:
          file: "build.gradle.kts"

      - name: Download build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: "IridiumColorAPI"
          path: "./"

      - name: Find IridiumColorAPI jar
        id: find_jar
        run: |
          FILE=$(find . -type f -name "IridiumColorAPI-*.jar" | head -n 1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus with curl
        run: |
          curl --location 'https://nexus.iridiumdevelopment.net/service/rest/v1/components?repository=maven-releases' \
          --header 'Authorization: Basic ${{ secrets.NEXUS_AUTH }}' \
          -F "maven2.groupId=com.iridium" \
          -F "maven2.artifactId=IridiumColorAPI" \
          -F "maven2.version=${{ steps.version.outputs.version }}" \
          -F "maven2.generate-pom=true" \
          -F "maven2.asset1=@${{ steps.find_jar.outputs.file }}" \
          -F "maven2.asset1.extension=jar"